</style><main><header><p>DICEKEEP · ART REVIEW 123</p><h1>원래의 타워, 같은 캐주얼 화풍</h1><p>기존 구조와 게임 내 크기를 유지한 2~6성 · 투사체 · 맵과 소품</p><a href="../?v=123">게임 열기</a></header><div class="grid"><article><h2>★2 쌍포 요새</h2><div class="pair"><figure><img src="casual-world/before-2.webp" alt="기존 쌍포 요새"><figcaption>원본</figcaption></figure><figure><img src="../casual/towers/t2-a.png?v=casual-world1" alt="새 쌍포 요새"><figcaption>캐주얼 리페인트</figcaption></figure></div><img class="shot" src="../vfx/shell.png?v=casual-world1" alt="쌍포 요새 투사체"></article><article><h2>★3 비전 첨탑</h2><div class="pair"><figure><img src="casual-world/before-3.webp" alt="기존 비전 첨탑"><figcaption>원본</figcaption></figure><figure><img src="../casual/towers/t3-a.png?v=casual-world1" alt="새 비전 첨탑"><figcaption>캐주얼 리페인트</figcaption></figure></div><img class="shot" src="../vfx/bolt.png?v=casual-world1" alt="비전 첨탑 투사체"></article><article><h2>★4 서리 첨탑</h2><div class="pair"><figure><img src="casual-world/before-4.webp" alt="기존 서리 첨탑"><figcaption>원본</figcaption></figure><figure><img src="../casual/towers/t4-a.png?v=casual-world1" alt="새 서리 첨탑"><figcaption>캐주얼 리페인트</figcaption></figure></div><img class="shot" src="../vfx/frost-shard.png?v=casual-world1" alt="서리 첨탑 투사체"></article><article><h2>★5 뇌전 코일</h2><div class="pair"><figure><img src="casual-world/before-5.webp" alt="기존 뇌전 코일"><figcaption>원본</figcaption></figure><figure><img src="../casual/towers/t5-a.png?v=casual-world1" alt="새 뇌전 코일"><figcaption>캐주얼 리페인트</figcaption></figure></div><img class="shot" src="../vfx/lightning-arc.png?v=casual-world1" alt="뇌전 코일 투사체"></article><article><h2>★6 왕관 요새</h2><div class="pair"><figure><img src="casual-world/before-6.webp" alt="기존 왕관 요새"><figcaption>원본</figcaption></figure><figure><img src="../casual/towers/t6-a.png?v=casual-world1" alt="새 왕관 요새"><figcaption>캐주얼 리페인트</figcaption></figure></div><img class="shot" src="../vfx/die-bomb.png?v=casual-world1" alt="왕관 요새 투사체"></article></div><h2>명중 효과</h2><p>포격 · 마법 · 빙결 · 주사위 폭발</p><button id="play">효과 const effects=[...document.querySelectorAll('[data-fx]')].map(c=>{const img=new Image();img.src='../vfx/'+c.dataset.fx+'-2x2.png?v=casual-world1';img.onload=()=>paint(c,img,1);return{c,img}});function paint(c,img,f){const g=c.getContext('2d');g.clearRect(0,0,260,260);g.drawImage(img,f%2*img.width/2,Math.floor(f/2)*img.height/2,img.width/2,img.height/2,0,0,260,260)}document.querySelector('#play').onclick=()=>{let start=performance.now();function frame(now){const age=now-start;for(const{c,img}of effects)if(img.complete)paint(c,img,Math.min(3,Math.floor(age/110)));if(age<440)requestAnimationFrame(frame)}requestAnimationFrame(frame)};
</script></html>
