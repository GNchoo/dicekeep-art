<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>주사위 성채 · 무식물 타워 비교</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #171d27; color: #f6eddb; font: 16px/1.55 system-ui, sans-serif; }
    main { max-width: 1120px; margin: auto; padding: 28px 20px 56px; }
    a { color: #aeeaff; }
    h1 { margin: 8px 0; font-size: clamp(27px, 4vw, 42px); line-height: 1.15; }
    h2 { margin: 0 0 12px; font-size: 20px; }
    p { color: #ced6d6; }
    header { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 16px; margin-bottom: 24px; }
    .eyebrow { margin: 0; color: #76d6e7; font-size: 12px; font-weight: 800; letter-spacing: .14em; }
    .nav { display: flex; gap: 14px; flex-wrap: wrap; }
    .nav a { font-weight: 700; text-decoration: none; }
    .intro { margin: 0 0 25px; max-width: 720px; }
    .panel { border: 1px solid #596578; border-radius: 18px; background: #222c3b; padding: 22px; margin-bottom: 24px; }
    .toolbar { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 14px; margin-bottom: 16px; }
    .tabs { display: flex; flex-wrap: wrap; gap: 8px; }
    button { background: #2d3b50; color: #e7edec; border: 1px solid #708099; border-radius: 999px; padding: 8px 14px; font: inherit; cursor: pointer; }
    button[aria-pressed="true"] { background: #e1b85d; border-color: #f4d98c; color: #221b16; font-weight: 800; }
    button:focus-visible, a:focus-visible { outline: 3px solid #83e8ff; outline-offset: 3px; }
    .board { border: 3px solid #a58e69; border-radius: 18px; min-height: 176px; display: grid; grid-template-columns: repeat(6,minmax(0,1fr)); align-items: end; justify-items: center; gap: 8px; padding: 26px 12px 14px; background: #77716d url('../casual/tiles/arena/board.png') center / 440px auto repeat; box-shadow: inset 0 0 32px #0008; }
    .board.plains { background: #6c9a4b url('../casual/tiles/plains/floor.jpg') center / 500px auto repeat; border-color: #baa778; }
    .board.castle { background-color: #80827d; border-color: #b6ae9f; }
    .board.hell { background-color: #532b32; border-color: #bc7454; background-blend-mode: luminosity; }
    .slot { display: flex; flex-direction: column; align-items: center; gap: 5px; min-width: 0; }
    .slot img { display: block; max-width: 70px; max-height: 96px; width: auto; height: auto; filter: drop-shadow(0 5px 3px #1119); }
    .slot span { background: #16202bcc; padding: 1px 7px; border-radius: 7px; font-size: 12px; }
    #modeNote { margin: 12px 0 0; font-size: 14px; }
    .grid { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 14px; }
    article { background: #242e3d; border: 1px solid #4e5c6f; border-radius: 16px; padding: 16px; }
    .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    figure { min-width: 0; margin: 0; border-radius: 12px; background: #334050; text-align: center; padding: 12px 4px 7px; }
    figure.clean { background: #41434d; }
    figure img { display: block; height: 180px; max-width: 100%; width: auto; object-fit: contain; margin: auto; }
    figcaption { margin-top: 6px; font-size: 13px; color: #ebdfc8; }
    .foot { margin-top: 20px; font-size: 14px; }
    @media (max-width: 830px) { .grid { grid-template-columns: repeat(2,minmax(0,1fr)); } }
    @media (max-width: 540px) { main { padding: 20px 12px; } .panel { padding: 14px; } .grid { grid-template-columns: 1fr; } .board { gap: 2px; padding-inline: 4px; min-height: 126px; } .slot img { max-width: 44px; max-height: 66px; } .slot span { font-size: 10px; } }
  </style>
</head>
<body>
<main>
  <header>
    <div><p class="eyebrow">DICEKEEP · ART REVIEW 124</p><h1>풀 없이, 더 간결하게</h1></div>
    <nav class="nav"><a href="../?v=124">게임 열기</a><a href="casual-world-v123.html">이전 아트 비교</a></nav>
  </header>
  <p class="intro">1~6성의 특징은 유지하고 풀·이끼·덩굴을 걷어냈습니다. 지붕 타일과 벽돌 선도 줄여 작은 게임 화면에서 형태가 먼저 보이게 했습니다.</p>
  <section class="panel" aria-label="맵별 타워 미리보기">
    <div class="toolbar"><h2>게임 크기 · 맵별 적용</h2><div class="tabs" id="tabs"></div></div>
    <div class="board" id="board"></div>
    <p id="modeNote"></p>
  </section>
  <section aria-label="타워별 전후 비교"><h2>원본과 무식물 버전</h2><div class="grid" id="cards"></div></section>
  <p class="foot">기존 타워는 초원·숲·호수·어두운 숲에 남아 있습니다. 무식물 버전은 투기장·성·지옥에 적용되며, 다른 외형 스킨과 구매 외형은 그대로 유지됩니다.</p>
</main>
<script>
  const names = ['목조 망루','쌍포 요새','비전 첨탑','서리 첨탑','뇌전 코일','왕관 요새'];
  const original = n => `../casual/towers/t${n}-a.png?v=124`;
  const clean = n => `../casual/towers/t${n}-clean.png?v=124`;
  const themes = [
    {id:'arena',label:'투기장',clean:true,note:'석조 투기장에서는 풀이 없는 간결한 타워가 자동 적용됩니다.'},
    {id:'plains',label:'초원',clean:false,note:'풀밭에서는 기존의 풀·이끼가 있는 타워를 사용합니다.'},
    {id:'castle',label:'성',clean:true,note:'석조 성 지역에서는 무식물 타워를 사용합니다.'},
    {id:'hell',label:'지옥',clean:true,note:'지옥 지역에서도 초록 식물 없이 타워가 보입니다.'},
  ];
  const tabs = document.querySelector('#tabs');
  const board = document.querySelector('#board');
  const cards = document.querySelector('#cards');
  for (let n=1;n<=6;n++) cards.insertAdjacentHTML('beforeend',`<article><h2>★${n} ${names[n-1]}</h2><div class="pair"><figure><img src="${original(n)}" alt="${names[n-1]} 원본"><figcaption>풀 있는 원본</figcaption></figure><figure class="clean"><img src="${clean(n)}" alt="${names[n-1]} 무식물 버전"><figcaption>풀 없는 간결한 버전</figcaption></figure></div></article>`);
  function selectTheme(theme) {
    board.className = `board ${theme.id}`;
    board.innerHTML = names.map((name,i)=>`<div class="slot"><img src="${theme.clean?clean(i+1):original(i+1)}" alt="★${i+1} ${name}"><span>★${i+1}</span></div>`).join('');
    document.querySelector('#modeNote').textContent = theme.note;
    tabs.querySelectorAll('button').forEach(button=>button.setAttribute('aria-pressed',button.dataset.theme===theme.id?'true':'false'));
  }
  for (const theme of themes) { const button=document.createElement('button');button.type='button';button.textContent=theme.label;button.dataset.theme=theme.id;button.onclick=()=>selectTheme(theme);tabs.append(button); }
  selectTheme(themes[0]);
</script>
</body>
</html>
